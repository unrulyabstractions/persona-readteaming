[project]
name = "persona-redteaming"
version = "0.1.0"
description = "Agentic rollouts of open-weight models, teacher-forced activation harvest, and the cloud discipline around them"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=5.16.1",
    "safetensors>=0.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "requests>=2.32",
    "huggingface_hub>=1.7.0",
    "agent-interp-envs",
]

[project.scripts]
replay = "persona_redteaming.replay.cli:main"
pr-campaign = "persona_redteaming.envs.campaign:main"
pr-grade = "persona_redteaming.envs.grade:main"
pr-harvest = "persona_redteaming.envs.harvest:main"
pr-upload = "persona_redteaming.envs.upload:main"
hf-upload-verified = "persona_redteaming.cloud.hf_upload:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
agent-interp-envs = { path = "submodules/agent-interp-envs", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_redteaming"]

[tool.pytest.ini_options]
testpaths = ["tests"]
